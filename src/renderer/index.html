<!doctype html>
<!-- `lang` is declared rather than left off: it is what the engine uses to pick
     a Han font face, to break lines in a script with no spaces, and to choose
     speech phonetics. `useDocumentLanguage` rewrites it on the live element as
     soon as the stored language setting is known. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fleet</title>
    <!-- Preload bundled Nerd Fonts so they're ready before xterm.js canvas renders -->
    <link
      rel="preload"
      href="./src/assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="./src/assets/fonts/SymbolsNerdFontMono-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
